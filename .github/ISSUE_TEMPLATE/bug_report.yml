name: Bug
description: Something that does not work as expected
title: "fix: <short description>"
labels: ["bug"]
type: Bug
projects: ["Kntro-Soft/3"]
body:
  - type: markdown
    attributes:
      value: |
        Work on it in a branch named `bugfix/<issue-number>-<slug>` (or `hotfix/X.Y.Z` if production is broken) and close it from the pull request with `Closes #<issue-number>`.
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we verify the fix.
      value: |
        Scenario: <name>
          Given <context that triggered the bug>
          When <action>
          Then <expected behavior>
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Component
      options:
        - reqsai-api (backend)
        - reqsai-web (frontend)
        - reqsai-landing (landing page)
        - reqsai-infra (infrastructure)
        - reqsai-report (report)
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment, version or commit
    validations:
      required: false
